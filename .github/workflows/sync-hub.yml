name: Sync Plugin Hub Catalog

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_resync:
        description: "Force re-download and re-index all ikuaiapp plugin releases"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [plugin-release]

permissions:
  contents: write

concurrency:
  group: sync-plugin-hub
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin-hub main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Discover and sync ikuaiapp plugin releases
        env:
          GH_TOKEN: ${{ secrets.HUB_SYNC_TOKEN || github.token }}
        run: |
          extra_flags=""
          if [ "${{ inputs.force_resync }}" = "true" ]; then
            extra_flags="--force"
          fi
          python3 -B scripts/sync_hub.py --upload-release --bump-version --json $extra_flags

      - name: Validate catalog, unit tests, and working-tree audit
        run: |
          python3 -B scripts/build_index.py --check
          python3 -B -m unittest discover -s tests -p "test_*.py" -v
          python3 -B scripts/public_audit.py --working-tree

      - name: Commit and push catalog updates if changed
        id: commit_step
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION catalog_sources.json SOURCES.json plugins.json icons/
          git commit -m "chore(hub): auto-sync ikuaiapp plugin catalog"
          python3 -B scripts/public_audit.py --history HEAD
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify live mirror and asset integrity
        run: |
          python3 -B scripts/verify_mirrors.py --check-assets --all-plugins --json
          python3 -B scripts/build_index.py --verify-remote --check
